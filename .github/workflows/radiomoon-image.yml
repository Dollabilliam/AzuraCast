name: Publish RadioMoon Image
on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Validate without publishing or changing production
        type: boolean
        default: true
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - ".github/ISSUE_TEMPLATE/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Publish RadioMoon Image
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      APPLICATION_ENV: testing
      NODE_ENV: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl
          tools: composer:v2

      - name: Cache PHP dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.OS }}-build-${{ hashFiles('composer.lock') }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: "npm"

      - name: Verify patched build Node
        run: node -e 'const a=require("node:assert/strict");a.equal(process.versions.node,"22.23.4");a.equal(require("node:zlib").constants.BROTLI_DECODER_ERROR_FORMAT_BLOCK_SWITCH,-17)'

      - name: Prepare workspace
        run: |
          rm -rf web/static/vite_dist
          chmod a+x backend/bin/*

      - name: Install build dependencies
        run: |
          composer install --no-interaction --ignore-platform-reqs --no-progress
          npm ci --include=dev

      - name: Build application assets
        run: |
          npm run build
          backend/bin/console azuracast:api:docs
          bash util/write_git_info.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        if: github.event_name != 'workflow_dispatch' || !inputs.validate_only
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/azuracast-radiomoon
          flavor: |
            latest=false
          tags: |
            type=raw,value=radiomoon,enable=${{ github.ref_name == github.event.repository.default_branch }}
            type=sha,prefix=git-

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'workflow_dispatch' || !inputs.validate_only }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
